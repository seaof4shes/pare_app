name: pare_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2026

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  ffmpeg_kit_flutter_new_audio: ^2.5.2

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  package_info_plus: ^8.3.1
  shared_preferences: ^2.3.2   
  app_settings: ^5.1.1
  permission_handler: ^12.0.1
  flutter_litert: ^3.8.0
  another_telephony: ^0.4.1
  flutter_local_notifications: ^19.0.0
  phone_state: ^2.1.1
  flutter_contacts: ^1.1.9+2
  encrypt: ^5.0.3
  
  sqflite: ^2.4.1
  path: ^1.9.1
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.2.2
  record: ^6.2.0
  path_provider: ^2.1.5
  file_picker: ^11.0.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/PARE.png
    - assets/models/sms_scam_model.tflite
    - assets/models/sms_manifest.json
    - assets/models/vocab.json
    - assets/models/voice_model_v6.tflite

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/PARE.png"
  adaptive_icon_background: "#0755C9"
  adaptive_icon_foreground: "assets/icon/PARE.png"
  adaptive_icon_foreground_inset: 26
  remove_alpha_ios: true
  background_color_ios: "#0755C9"
